<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 09</title>
    <style>
.page {
  display: grid;
  grid-template-areas:
    "header header"
    "nav    nav"
    "aside  main"
    "footer footer";
  grid-template-columns: 250px 1fr;
  grid-template-rows: auto auto 1fr auto;
  height: 100vh;
}
header { grid-area: header; background: #797777; color:white; padding:1rem; }
nav    { grid-area: nav; background: #585555; color:white; padding:1rem; }
main   { grid-area: main; padding:1rem; }
aside  { grid-area: aside; background:#eee; padding:1rem; }
footer { grid-area: footer; background:#817e7e; color:white; padding:1rem; }

@media (max-width: 700px) {
  .page {
    grid-template-areas:
      "header"
      "nav"
      "main"
      "aside"
      "footer";
    grid-template-columns: 1fr;
  }
}
body{
    text-align: center;
    
}
</style>
</head>
<body>
    <div class="page">
  <header>Header</header>
  <nav>Navigation</nav>
  <aside>Aside</aside>
  <main>Main Content</main>
  <footer>Footer</footer>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 09</title>

    <style>
        /* Task 06 */
.container {
  display: flex;
  gap: 1rem;
  padding: 1rem;
  flex-wrap: wrap;
}

.column {
  background: #9aabf6;
  flex: 1 1 300px;
  padding: 1rem;
  border-radius: 8px;
}
 /* Task 07 */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  padding: 1rem;
}

.product {
  background: #d6c2c2;
  padding: 1rem;
  border-radius: 8px;
}

/* Task 09 */

.button-row {
  display: flex;
  justify-content: space-evenly;
  padding: 1rem;
  background: #fafafa;
}

button {
  padding: 0.6rem 1.2rem;
  border: none;
  background: #4CAF50;
  color: white;
  border-radius: 5px;
}

div{
  text-align: center;
}
</style>


</head>
<body>
  <h2>Task 06</h2>

<div class="container">
  <div class="column">Column 1</div>
  <div class="column">Column 2</div>
  <div class="column">Column 3</div>
</div>

  <h2>Task 07</h2>

<div class="product-grid">
  <div class="product">Product 1</div>
  <div class="product">Product 2</div>
  <div class="product">Product 3</div>
  <div class="product">Product 4</div>
</div>

<h2>Task 09</h2>

<div class="button-row">
  <button>Accept</button>
  <button>Decline</button>

</div>

</body>
</html>

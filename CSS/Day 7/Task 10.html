<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 7 Task 10</title>

    <link rel="stylesheet" href="style.css">

    <style>

body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
}
.container {
  width: 80%;
  margin: 40px auto;
  text-align: center;
}


.box {
  border: 2px solid #333;
  background-color: #fff;
  width: 60%;
  margin: 0 auto 30px;
  transition: 0.3s;
}
    </style>
</head>
<body>
  <div class="container">
  <div class="box box1">
    <h3>Box 1: Margin Example</h3>
    <p>This box has a large <strong>margin</strong> around it.</p>
  </div>

  <div class="box box2">
    <h3>Box 2: Padding Example</h3>
    <p>This box has large <strong>padding</strong> inside it.</p>
  </div>

  <div class="box box3">
    <h3>Box 3: Margin + Padding</h3>
    <p>This box uses both <strong>margin</strong> and <strong>padding</strong>.</p>
  </div>
</div>

</body>
</html>

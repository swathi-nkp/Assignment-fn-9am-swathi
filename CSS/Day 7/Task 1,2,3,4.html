<head>

    <title>Day 7</title>

<style>
  .box {
    margin: 30px;                
    border: 5px solid #0074D9;   
    background-color: #E0F7FF;

    font-family: Arial, sans-serif;
    border-style:solid;       /*Task 4*/   
  }

    margin: 50px;
    border: 5px solid green;
    background-color: rgb(161, 244, 161);

  }

  .padding {
    margin: 50px;
    border : 5px solid brown;
    padding: 20px;
    background-color:rgb(240, 110, 110);
    width: 200px;
    border-style: dashed;     /* Task 5*/
  }

  .label {

  }


  body {
    background-color: #f5f5f5;

    <h1> Task 1 </h1> 

<div class="box">

  <div class="label"><strong>Border:</strong> 5px solid blue</div>
  <div class="label"><strong>Margin:</strong> 30px (space outside box)</div>
</div>

   <h1> Task 2 </h1>
<div class="border">
  <div class="label"><strong>Second Box:</strong> Adjust margin to see spacing change.</div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Parlour</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>


<!-- SIMPLE HERO CAROUSEL   -->
<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9" class="d-block w-100" style="height:400px; object-fit:cover;">
            <div class="carousel-caption">
                <h3>Welcome to Beauty Parlour</h3>
                <p>Glow with confidence</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contactModal">Book Now</button>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1559599101-f09722fb4948" class="d-block w-100" style="height:400px; object-fit:cover;">
            <div class="carousel-caption">
                <h3>Hair • Skin • Makeup</h3>
                <p>Professional & affordable</p>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<br>

<!-- SIMPLE FAQ COLLAPSE    -->

<div class="container">
    <h3 class="mb-3">FAQ</h3>

    <div class="accordion" id="faq">

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#faq1">
                    What services do you offer?
                </button>
            </h2>
            <div id="faq1" class="accordion-collapse collapse show">
                <div class="accordion-body">
                    Makeup, facials, hair spa, hair styling, bridal packages and more.
                </div>
            </div>
        </div>

        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#faq2">
                    Do I need an appointment?
                </button>
            </h2>
            <div id="faq2" class="accordion-collapse collapse">
                <div class="accordion-body">
                    Yes, booking in advance is recommended.
                </div>
            </div>
        </div>

    </div>
</div>

<br>


<!-- SIMPLE MODAL FORM      -->

<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Book Appointment</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="text" class="form-control mb-2" placeholder="Your Name">
                <input type="text" class="form-control mb-2" placeholder="Phone Number">
                <select class="form-select mb-2">
                    <option>Select Service</option>
                    <option>Makeup</option>
                    <option>Hair Styling</option>
                    <option>Facial</option>
                    <option>Bridal Makeup</option>
                </select>
                <textarea class="form-control mb-2" placeholder="Message"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary">Submit</button>
            </div>

        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

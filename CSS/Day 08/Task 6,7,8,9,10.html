<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 08</title>
  <style>
    

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    /* TASK 07*/
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: rgb(5, 1, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      z-index: 1000;
    }

    nav .logo {
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav ul {
      list-style: none;
      display: flex;
    }

    nav ul li {
      margin-left: 25px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #00bcd4;
    }

    /* TASK 06*/
    .hero {
      background: url('./pexels-christian-heitz-285904-842711.jpg') center/cover no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
    }

    .hero-content {
      position: relative;
      color: white;

    }

    .hero-content h1 {
      font-size: 3em;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .hero-content p {
      font-size: 1.2em;
      max-width: 600px;
      margin: 0 auto;
    }

    /* TASK 09*/
    .about {
      padding: 100px 20px;
      background: #f9f9f9;
      text-align: center;
    }

    .about h2 {
      font-size: 2em;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .about p {
      font-size: 1.1em;
      max-width: 800px;
      margin: 0 auto;
      letter-spacing: 0.5px;
      line-height: 1.8;
      color: #555;
    }

    /* TASK 08 */
    .contact-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #00bcd4;
      color: white;
      border: none;
      padding: 15px 25px;
      border-radius: 50px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);


    }

    .contact-btn:hover {
      background: #0097a7;
    }

    /* TASK 10 */
    header.sticky {
      position: sticky;
      top: 0;
      background: #fff;
      color: #333;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;

    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">MyBrand</div>
    <ul>
      <li><a href="#hero">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <header class="sticky">
    Scroll down — this header sticks to the top!
  </header>
  <section class="hero" id="hero">
    <div class="hero-content">
      <h1>Welcome to Our Page</h1>

    </div>
  </section>
  <section class="about" id="about">
    <h2>About Us</h2>
    <p>
      Our team creates stunning websites, memorable brands, and effective digital solutions—with clean design, clear
      communication, and smart strategy.
    </p>
  </section>

  <button class="contact-btn" id="contact">Contact Us</button>

</body>

</html>

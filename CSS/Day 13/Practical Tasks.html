<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical Tasks</title>
    <style>
        /* Task 01 */
        .loader {
  width: 50px;
  height: 50px;
  border: 4px solid #ddd;
  border-top-color: #3498db;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Task 02 */

.flip-card {
  width: 200px;
  height: 120px;
  perspective: 800px;
}

.flip-inner {
  width: 100%;
  height: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
}

.flip-card:hover .flip-inner {
  transform: rotateY(180deg);
}

.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  border-radius: 10px;
}

.front {
  background: #db34b7;
  color: #fff;
}

.back {
  background: #0dc237;
  color: #fff;
  transform: rotateY(180deg);
}

/* Task 03 */

.progress-container {
  width: 300px;
  height: 15px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #1acd38;
  width: 0%;
  animation: fill 3s forwards;
}

@keyframes fill {
  to {
    width: 100%;
  }
}
/* Task 04 */

.ball {
  width: 40px;
  height: 40px;
  background: #5e3ce7;
  border-radius: 50%;
  position: relative;
  animation: bounce 0.6s ease-in-out infinite alternate;
}

@keyframes bounce {
  from {
    transform: translateY(0);
  }
  to {
    transform: translateY(120px);
  }
}

/* Task 05 */

.card {
  width: 260px;
  padding: 20px;
  border-radius: 10px;
  background: #d2d1d1;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.card img {
  width: 100%;
  border-radius: 10px;
  transition: transform 0.3s;
}

.card:hover img {
  transform: scale(1.05);
}






    </style>
</head>
<body>
    <!--  Task 01  -->
      <h2> 1. Loader Animation </h2>
    <div class="loader"></div><br>

    <!-- Task 02 -->
     <h2>2. Card Flip Effect</h2>
     <div class="flip-card">
  <div class="flip-inner">
    <div class="front">Front</div>
    <div class="back">Back</div><br>
  </div>
</div>

   <!-- Task 03 -->
<h2>3.Progress Bar Fill Animation</h2>
<div class="progress-container">
  <div class="progress-bar"></div><br>
</div>

<!-- Task 04 -->
<h2>4. Bouncing Ball Animation</h2>
<div class="ball"></div><br><br><br><br><br><br>

<!-- Task 05 -->
<h2>5. Hover Transitions for Portfolio</h2>
<div class="card">
  <img src="image.jpg" alt="">
  <h3>Sha Cosmetics</h3>
  <p>“Great service and excellent customer care.”</p>
</div>



</body>
</html>

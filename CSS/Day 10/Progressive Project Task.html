<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 10 - Progressive Project Tasks</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: rgb(245, 181, 124);
        }

        /* --FLEXBOX NAVBAR-- */
        nav {
            background: #222;
            color: white;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            align-items: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            margin: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            nav ul {
                flex-direction: column;
            }
        }

        /* -- FORM USING GRID -- */
        .form-container {
            width: 300px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;

            display: grid;
            gap: 10px;
        }

        .form-container input {
            padding: 8px;
            border: 1px solid #ccc;
        }

        .form-container button {
            padding: 10px;
            background: rgb(86, 86, 248);
            color: white;
            border: none;
        }

        /* -- PHOTO GALLERY GRID -- */
        .gallery {
            padding: 20px;
            display: grid;
            gap: 10px;
            align-items: center;

            /* auto-fill makes responsive columns */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }

        .gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        /* -- HERO CENTER USING FLEXBOX -- */
        .hero {
            height: 250px;
            background: url('https://via.placeholder.com/800x250') center/cover no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            color: rgb(4, 4, 4);
            font-size: 24px;
            text-shadow: 0 0 5px rgb(247, 239, 244);
        }

        /* --OLD FLOAT → NEW FLEXBOX -- */
        /* Old float layout replaced */
        .services {
            display: flex;
            padding: 20px;
            gap: 10px;
        }

        .service-box {
            flex: 1;
            background: #d0e8ff;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            width: 400rem;
            height: 40vh;
            background: rgb(238, 170, 110);
            border-bottom: #ccc;
            color: white;
    
        }
    </style>
</head>

<body>

    <!-- TASK 1-->
    <nav>

        <ul>
            <li><a href="#">About</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- TASK 4 -->
    <div class="hero">
        <h1>Sha Cosmetics</h1>
    </div>

    <!-- TASK 2 -->
    <h2 style="text-align:center;">Login</h2>
    <div class="form-container">
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        <button>Submit</button>
    </div>

    <!-- TASK 3 -->
    <h2 style="text-align:center;">Products</h2>
    <div class="gallery">
        <img
            src="https://www.shutterstock.com/image-photo/various-cosmetic-products-containers-bottles-600nw-2568529501.jpg">
        <img src="https://vivecosmetic.com/wp-content/uploads/2024/07/Top-10-Cosmetic-Companies-in-Kerala.jpeg">
        <img
            src="https://assets.teenvogue.com/photos/6184454b087dc3c0e7cb3d94/16:9/w_2560%2Cc_limit/GettyImages-1301487903.jpg">
        <img src="https://kronokare.com/cdn/shop/articles/face-care.jpg?v=1638874682&width=1100">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrbHvUDzoLyUgvkq-dQEnPSH-P5abYJUqXLQ&s">
    </div>

    <!-- TASK 5 -->
    <h2 style="text-align:center;">Our Services</h2>
    <div class="services">
        <div class="service-box">Hair & Scalp Treatement Advice</div>
        <div class="service-box">Acne Care Program</div>
        <div class="service-box">Product Ingredient Review</div>
    </div>

</body>

</html>
